spring.application.name=ProyectoComida
server.port=${PORT:8080}
api.version=${API_VERSION:v1}
# Para los mensajes en las excepciones
# server.error.include-message=always
# Para activar los mensajes nivel DEBUG en las clases es.carlosgs.tarjetas, por ejemplo
logging.level.es.danielmc.dispositivos=DEBUG
# Usando H2 Database en lugar de PostgreSQL
spring.datasource.url=jdbc:h2:mem:proyecto_comida;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
# Habilitamos los mensajes sql en el log para ver las consultas
spring.jpa.show-sql=true
# Habilitamos que cargue los datos de prueba en la base de datos
spring.jpa.defer-datasource-initialization=true
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Perfil activo (cambiar a prod en produccion)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
jwt.secret=${JWT_SECRET:MiClaveSecretaSuperSeguraYLargaParaProduccion2024!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Encoding UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.force=true
spring.servlet.encoding.enabled=true
spring.sql.init.encoding=UTF-8