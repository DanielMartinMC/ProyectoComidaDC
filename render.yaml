services:
  - type: web
    name: proyecto-comida
    env: docker
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: proyecto-comida-db
          property: connectionString
      - key: JWT_SECRET
        sync: false

databases:
  - name: proyecto-comida-db
    plan: free