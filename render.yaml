services:
  - type: web
    name: proyecto-comida
    env: java
    plan: free
    buildCommand: ./mvnw clean package
    startCommand: java -Dspring.profiles.active=prod -jar target/ProyectoComida-*.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: proyecto-comida-db
          property: connectionString
      - key: JWT_SECRET
        sync: false

databases:
  - name: proyecto-comida-db
    plan: free

